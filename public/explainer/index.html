<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Room — מנגנים יחד, נשארים יחד</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #0c1412; color: #f1f6ef; font-family: Arial, sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 460px); }
    h1 { font-size: 20px; font-weight: 500; margin: 0 0 16px; }
    canvas { display: block; width: 100%; aspect-ratio: 9/16; border-radius: 20px; background: #101d19; box-shadow: 0 20px 80px #0005; }
    .film-frame { position: relative; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 18px; }
    button { min-height: 44px; border: 1px solid #365044; border-radius: 12px; background: #1d3028; color: #fff; padding: 10px 18px; font: inherit; cursor: pointer; }
    button.primary { background: #b6e491; color: #102015; border-color: #b6e491; }
    .home-button { position: absolute; top: 89%; left: 50%; transform: translate(-50%, -50%); display: grid; place-items: center; width: 72%; padding: 12px; min-height: 48px; border-radius: 14px; background: #b6e491; color: #102015; text-align: center; text-decoration: none; font-size: clamp(17px, 4vw, 21px); font-weight: 700; }
    .home-button[hidden] { display: none; }
    .home-button:focus-visible { outline: 3px solid #b6e491; outline-offset: 4px; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 3px solid #b6e491; outline-offset: 4px; }
    input { flex: 1; min-width: 110px; accent-color: #b6e491; direction: ltr; }
    output { direction: ltr; font-variant-numeric: tabular-nums; }
    #volume { flex: 0 1 100px; min-width: 75px; } .back-link { display: block; padding: 14px; text-align: center; color: #b6e491; text-underline-offset: 4px; } .controls button { padding: 8px 12px; min-width: 44px; } .controls { direction: ltr; } #status:not(:empty) { display: block; }
    .note { color: #a9bcb0; font-size: 14px; line-height: 1.6; }
    #status:empty { display: none; }
    details { margin-top: 24px; color: #a9bcb0; line-height: 1.8; }
    @media (max-width: 600px) { body { padding: 12px; } canvas { border-radius: 12px; } h1 { font-size: 17px; } .controls { gap: 8px; } }
  </style>
</head>
<body>
  <main>
    <div class="film-frame">
      <canvas id="film" width="720" height="1280" role="img" aria-label="סרטון המחשה: לפני Music Room כל נגן מחפש וגולל לבד. יוצרים חדר, משתפים קוד או קישור, בוחרים שיר, וכולם רואים את הגלילה והזום של המוביל."></canvas>
      <a id="go-home" class="home-button" href="/" hidden>להתחלה - לחץ כאן</a>
    </div>
    <div class="controls" aria-label="שליטה בסרטון">
      <button id="play" class="primary" aria-label="ניגון">▶</button>
      <button id="stop" aria-label="עצירה">■</button>
      <input id="timeline" type="range" min="0" max="42" step="0.1" value="0" aria-label="מיקום בסרטון">
      <output id="time">0:00 / 0:42</output>
      <button id="sound" aria-label="השתקה" aria-pressed="false">🔊</button>
      <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7" aria-label="עוצמת קול">
    </div>
    <p id="status" role="status"></p>
    <a class="back-link" href="/">חזרה לעמוד הבית</a>
  </main>
  <script type="module" src="./explainer.js"></script>
</body>
</html>
